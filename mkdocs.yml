site_name: enoppy-core
site_description: A Python library for engineering optimization problems.
site_url: https://ltsim.github.io/enoppy-core/
repo_url: https://github.com/ltsim/enoppy-core
edit_uri: blob/main/docs/

theme:
  name: material
  icon:
    logo: material/engine
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - bibtex:
      bib_file: references.bib
      enable_inline_citations: false
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            heading_level: 2
            show_root_heading: false
            members_order: alphabetical
            group_by_category: true
            show_category_heading: true
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: table
            show_source: false

markdown_extensions:
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Usage: usage.md
  - API Reference:
      - Overview: api/index.md
      - Core:
          - Engineer: api/engineer.md
      - Utils:
          - LabelEncoder: api/encoder.md
          - Validators: api/validator.md
      - Paper-based:
          - ihaoavoa 2022: api/ihaoavoa_2022.md
          - moeosma 2023: api/moeosma_2023.md
          - pdo 2022: api/pdo_2022.md
          - rwco 2020: api/rwco_2020.md
  - References: references.md
