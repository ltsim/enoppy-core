[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enoppy-core"
version = "0.1.2"
description = "ENOPPY-core: Engineering Optimization Problems with support Python3.10+"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
keywords = [
    "engineering optimization problems", "mathematical optimization",
    "numba", "numpy2", "pypy", "metaheuristics",
    "stochastic optimization", "global optimization"
]

authors = [
    { name = "Thieu", email = "nguyenthieu2102@gmail.com" }
]

maintainers = [
    { name = "ltsim", email = "tsim@cucei.udg.mx" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "numba>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "twine>=4.0.1",
    "mypy",
    "ruff"
]

[project.urls]
"Homepage" = "https://github.com/thieu1995/enoppy"
"Documentation" = "https://enoppy.readthedocs.io/"
"Source Code" = "https://github.com/thieu1995/enoppy"
"Original Source" = "https://github.com/thieu1995/enoppy"
"Bug Tracker" = "https://github.com/thieu1995/enoppy/issues"

[tool.setuptools]
packages = { find = { exclude = ["tests*", "examples*"] } }
include-package-data = true

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numba.*", "scipy.*"]
ignore_missing_imports = true