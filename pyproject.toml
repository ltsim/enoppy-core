[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enoppy-core"
dynamic = ["version"]
description = "A Python Library for Engineering Optimization Problems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPLv3" }
keywords = [
    "engineering optimization problems", "mathematical optimization", "numpy2", "metaheuristics", "scipy",
    "stochastic optimization", "global optimization"
]

authors = [
    { name = "Thieu", email = "nguyenthieu2102@gmail.com" }
]

maintainers = [
    { name = "ltsim", email = "tsim@cucei.udg.mx" }
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Benchmark",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "numpy>=2.1.3",
    "scipy>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "twine>=4.0.1",
    "mypy",
    "ruff"
]

[project.urls]
"Homepage" = "https://github.com/ltsim/enoppy-core"
"Documentation" = "https://enoppy.readthedocs.io/"
"Source Code" = "https://github.com/ltsim/enoppy-core"
"Original Source" = "https://github.com/ltsim/enoppy-core"
"Bug Tracker" = "https://github.com/ltsim/enoppy-core/issues"

[tool.setuptools]
packages = { find = { exclude = ["tests*", "examples*"] } }
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "enoppy.__version__"}

[tool.mypy]
files = ["enoppy"]
exclude = ["tests/", "docs/", "examples/"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = false
disallow_any_unimported = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
check_untyped_defs = true
warn_return_any = false
show_error_codes = true
show_column_numbers = true
pretty = true
error_summary = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "numpy",
    "numpy.*"
]
ignore_missing_imports = true